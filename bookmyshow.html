
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookMyShow Navbar</title>

    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

     
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 8%;
            gap: 20px;
        }

     
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        .logo span {
            color: #e31837;
        }

      
        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 15px;
            flex: 1;
            max-width: 500px;
            color: #777;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 12px;
        }

        
        .right-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .location {
            font-size: 12px;
            color: #333;
            white-space: nowrap;
        }

        .location i {
            margin-left: 5px;
        }

        .sign-in {
            background-color: #f84464;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px 15px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .menu-icon {
            color: #555;
            font-size: 18px;
            cursor: pointer;
        }

       
        .bottom-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8%;
            background-color: #f5f5f5;
            gap: 15px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 12px;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #f84464;
        }

        .extra-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .extra-links a {
            text-decoration: none;
            color: #555;
            font-size: 10px;
            white-space: nowrap;
        }

       
        @media (max-width: 750px) {
            .top-navbar {
                padding: 12px;
                flex-wrap: wrap;
            }

            .search-box {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .bottom-navbar {
                padding: 12px;
                flex-wrap: wrap;
            }

            .nav-links,
            .extra-links {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

  
    <header class="top-navbar">

        <div class="logo">
            book<span>my</span>show
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search for Movies, Events, Plays, Sports and Activities">
        </div>

        <div class="right-section">

            <div class="location">
                Pune
                <i class="fa-solid fa-chevron-down"></i>
            </div>

            <button class="sign-in">Sign In</button>

            <i class="fa-solid fa-bars menu-icon"></i>

        </div>

    </header>

    <nav class="bottom-navbar">

        <div class="nav-links">
            <a href="#">Movies</a>
            <a href="#">Stream</a>
            <a href="#">Events</a>
            <a href="#">Plays</a>
            <a href="#">Sports</a>
            <a href="#">Activities</a>
        </div>

        <div class="extra-links">
            <a href="#">ListYourShow</a>
            <a href="#">Corporates</a>
            <a href="#">Offers</a>
            <a href="#">Gift Cards</a>
        </div>

    </nav>

</body>
</html>
