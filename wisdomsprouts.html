
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wisdom Sprouts Navbar</title>

    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }


        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 7%;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            gap: 25px;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #163b65;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo i {
            font-size: 28px;
            color: #25a56a;
        }

        .logo span {
            color: #25a56a;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #25a56a;
        }

  
        .contact-btn {
            background-color: #25a56a;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
        }

        .contact-btn:hover {
            background-color: #1c8051;
        }

        .menu-icon {
            display: none;
            font-size: 23px;
            color: #163b65;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .navbar {
                padding: 15px 4%;
                gap: 15px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .logo {
                font-size: 18px;
            }
        }

        @media (max-width: 650px) {
            .nav-links,
            .contact-btn {
                display: none;
            }

            .menu-icon {
                display: block;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

  
        <div class="logo">
            <i class="fa-solid fa-seedling"></i>
            <div>Wisdom <span>Sprouts</span></div>
        </div>

     
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Courses</a>
            <a href="#">Services</a>
            <a href="#">Blog</a>
        </div>

      
        <a href="#" class="contact-btn">
            Contact Us <i class="fa-solid fa-arrow-right"></i>
        </a>

        
        <i class="fa-solid fa-bars menu-icon"></i>

    </nav>

</body>
</html>
